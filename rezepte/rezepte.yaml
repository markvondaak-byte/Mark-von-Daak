# Metadaten Band 3 — Das Rezeptbuch.

titel: "Der Stoffwechsel-Reset"
untertitel: "Das Rezeptbuch — 73 Gerichte ohne Salz und Zucker"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: beere   # blatt | zitrone | beere

slug: rezeptbuch

# 8 × 10 Zoll — dasselbe Großformat wie Band 2. Für ein Kochbuch das
# nützlichere Maß: Es liegt beim Kochen flach auf der Arbeitsfläche, und
# Zutatenliste und Zubereitung stehen nebeneinander statt untereinander.
#
# Vorher stand hier 6 × 9 Zoll wie bei Band 1. Der Preis des Wechsels: Bei
# 48 Prozent mehr Fläche je Seite fällt die Seitenzahl deutlich, und das Buch
# wird ein dünnes Heft in großem Format.
# Der Außensteg ist bewusst breit: Über die volle Seitenbreite gesetzt kämen
# 110 Zeichen in die Zeile, lesbar sind 60 bis 75. Der freie Rand ist beim
# Kochbuch kein verschenkter Platz, sondern der Daumen, mit dem man das Buch
# offen hält, und Raum für eigene Notizen.
seitenformat:
  breite_mm: 203.2      # 8 Zoll
  hoehe_mm: 254.0       # 10 Zoll
  rand_innen_mm: 22.0
  rand_aussen_mm: 42.0
  rand_oben_mm: 16.0
  rand_unten_mm: 16.0

impressum:
  name: "Mark von Daak"
  strasse: "Rabenbergstraße 16"
  ort: "38444 Wolfsburg"
  land: "Deutschland"
  email: "markvondaak@icloud.com"
  ustid: "DE319920422"

# Alle Mengenangaben sind auf diese Referenzperson gerechnet.
referenz:
  koerpergewicht_kg: 80
  hinweis: >-
    Die Eiweißmengen gelten für eine Person mit rund 80 kg Körpergewicht und
    moderater Bewegung. Wer deutlich mehr oder weniger wiegt, rechnet nach der
    Formel im Buch um: 0,8 bis 1,5 g Eiweiß je Kilogramm Körpergewicht.
