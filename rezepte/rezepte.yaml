# Metadaten Band 3 — Das Rezeptbuch.

titel: "Der Stoffwechsel-Reset"
untertitel: "Das Rezeptbuch — 73 Gerichte ohne Salz und Zucker"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: beere   # blatt | zitrone | beere

slug: rezeptbuch

# 8 × 10 Zoll — dasselbe Großformat wie Band 2. Für ein Kochbuch das
# nützlichere Maß: Es liegt beim Kochen flach auf der Arbeitsfläche, und
# Zutatenliste und Zubereitung stehen nebeneinander statt untereinander.
#
# Vorher stand hier 6 × 9 Zoll wie bei Band 1. Der Preis des Wechsels: Bei
# 48 Prozent mehr Fläche je Seite fällt die Seitenzahl deutlich, und das Buch
# wird ein dünnes Heft in großem Format.
# Der Außensteg ist bewusst breit: Über die volle Seitenbreite gesetzt kämen
# 110 Zeichen in die Zeile, lesbar sind 60 bis 75. Der freie Rand ist beim
# Kochbuch kein verschenkter Platz, sondern der Daumen, mit dem man das Buch
# offen hält, und Raum für eigene Notizen.
seitenformat:
  breite_mm: 203.2      # 8 Zoll
  hoehe_mm: 254.0       # 10 Zoll
  rand_innen_mm: 22.0
  rand_aussen_mm: 42.0
  rand_oben_mm: 16.0
  rand_unten_mm: 16.0

# Hardcover braucht ein eigenes Format. KDP führt 8 × 10 Zoll **nur** als
# Taschenbuch; für Hardcover gibt es 5,5×8,5 · 6×9 · 6,14×9,21 · 7×10 ·
# 8,25×11 Zoll und sonst nichts. Die kleinste Größe oberhalb von 8 × 10 ist
# damit 8,25 × 11 — der Umschlag wird sonst mit „erwartete Covergröße
# 18.442 × 12.417" zurückgewiesen.
#
# Die Ränder wachsen genau um die Formatdifferenz (6,35 mm in der Breite,
# 25,4 mm in der Höhe), je zur Hälfte auf beide Seiten. Der Satzspiegel bleibt
# dadurch millimetergenau derselbe, und das ist keine Kosmetik: Bei gleichem
# Textblock brechen die Zeilen gleich um, die Seitenzahl bleibt bei 76 — und
# nur damit bleibt der Band über KDPs Hardcover-Untergrenze von 75 Seiten.
# Bei gleichen Rändern hätte die größere Fläche ihn auf rund 67 Seiten
# gedrückt und damit wieder disqualifiziert.
hardcover_seitenformat:
  breite_mm: 209.55     # 8,25 Zoll
  hoehe_mm: 279.4       # 11 Zoll
  rand_innen_mm: 25.175
  rand_aussen_mm: 45.175
  rand_oben_mm: 28.7
  rand_unten_mm: 28.7

