# Metadaten Band 4 — Die Dopamin-Lüge.
# Wird von build/build_dopamin.py und build/build_cover.py gelesen.

titel: "Die Dopamin-Lüge"
untertitel: "Warum das Glückshormon kein Glück macht — und wie Sie Ihren Antrieb zurückholen"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Eigenständiger Titel außerhalb der Stoffwechsel-Reihe. Deshalb eine eigene
# Farbwelt: Indigo statt Blattgrün, Molekülgrafik statt Lebensmittelauslage.
cover_stil: schiefer

# Dateiname ohne Endung für alles unter out/
slug: dopamin-luege

# KDP-Satzspiegel — 6 x 9 Zoll, dasselbe Format wie Band 1.
#
# Der Band stand zuerst auf 5 x 8 Zoll. Umgestellt wurde er, weil das
# Taschenbuch bei KDP als 6 x 9 Zoll geführt wird; die Trimmgröße im
# Formular und das Maß der Datei müssen übereinstimmen, sonst lehnt der
# Upload mit „erwartete Covergröße …" ab. Nebeneffekt und Gewinn: Alle
# gedruckten Titel haben nun dasselbe Format und stehen im Regal auf einer
# Höhe.
#
# Die Ränder sind von Band 1 übernommen — dieselbe Seite, derselbe
# Satzspiegel: 152,4 - 20 - 16 = 116,4 mm Breite, bei 11 pt Serifenschrift
# rund 63 Zeichen je Zeile. Das ist der Bereich, in dem das Auge den
# Zeilenwechsel ohne Suchen findet.
seitenformat:
  breite_mm: 152.4      # 6 Zoll
  hoehe_mm: 228.6       # 9 Zoll
  rand_innen_mm: 20.0
  rand_aussen_mm: 16.0
  rand_oben_mm: 18.0
  rand_unten_mm: 18.0

# Hardcover im selben Format — 6 x 9 Zoll.
#
# KDP führt für Hardcover 5,5x8,5 · 6x9 · 6,14x9,21 · 7x10 · 8,25x11 Zoll und
# sonst nichts. Solange das Taschenbuch auf 5 x 8 Zoll stand, brauchte das
# Hardcover deshalb ein eigenes, größeres Format mit eigenen Rändern. Auf
# 6 x 9 Zoll entfällt der Grund: Das Maß steht in beiden Listen, beide
# Fassungen bekommen denselben Innenteil und damit zwangsläufig dieselbe
# Seitenzahl — und aus der Seitenzahl folgt die Rückenbreite.
#
# Der Block bleibt trotzdem stehen und wird nicht aus dem Code entfernt:
# build_cover.py liest ihn für den Hardcover-Umschlag, und wenn eine
# Fassung später doch das Format wechselt, wird sie hier geändert und
# nirgends sonst.
hardcover_seitenformat:
  breite_mm: 152.4      # 6 Zoll
  hoehe_mm: 228.6       # 9 Zoll
  rand_innen_mm: 20.0
  rand_aussen_mm: 16.0
  rand_oben_mm: 18.0
  rand_unten_mm: 18.0

