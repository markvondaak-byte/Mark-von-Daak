# Metadaten Band 4 — Die Dopamin-Lüge.
# Wird von build/build_dopamin.py und build/build_cover.py gelesen.

titel: "Die Dopamin-Lüge"
untertitel: "Warum das Glückshormon kein Glück macht — und wie Sie Ihren Antrieb zurückholen"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Eigenständiger Titel außerhalb der Stoffwechsel-Reihe. Deshalb eine eigene
# Farbwelt: Indigo statt Blattgrün, Molekülgrafik statt Lebensmittelauslage.
cover_stil: schiefer

# Dateiname ohne Endung für alles unter out/
slug: dopamin-luege

# KDP-Satzspiegel — 5 x 8 Zoll, das klassische Taschenbuchmaß.
#
# Nicht 6 x 9 wie Band 1: Ein Lesebuch aus reinem Fließtext, das man in der
# Bahn und im Bett liest, gehört in die Hand, nicht auf den Tisch. 5 x 8 Zoll
# steht in KDPs Auswahlliste der Trimmgrößen und muss nicht als
# benutzerdefiniertes Maß eingetragen werden.
#
# Die Ränder sind auf die Zeilenlänge gerechnet: 127 - 17 - 13 = 97 mm
# Satzspiegelbreite, bei 10,5 pt Serifenschrift rund 66 Zeichen je Zeile.
# Das ist der Bereich, in dem das Auge den Zeilenwechsel ohne Suchen findet.
seitenformat:
  breite_mm: 127.0      # 5 Zoll
  hoehe_mm: 203.2       # 8 Zoll
  rand_innen_mm: 17.0
  rand_aussen_mm: 13.0
  rand_oben_mm: 15.0
  rand_unten_mm: 16.0

# Hardcover in eigenem Format — 5,5 x 8,5 Zoll statt 5 x 8.
#
# KDP führt 5 x 8 Zoll ausschließlich als Taschenbuch. Für Hardcover gibt es
# 5,5x8,5 · 6x9 · 6,14x9,21 · 7x10 · 8,25x11 Zoll und sonst nichts; 5,5 x 8,5
# ist der kleinste Schritt darüber und bleibt damit am nächsten am
# Taschenbuch. Band 3 ist genau an dieser Stelle einmal aufgelaufen — der
# Upload lehnt mit „erwartete Covergröße …" ab.
#
# Die Ränder wachsen um exakt die halbe Formatdifferenz auf jeder Seite
# (6,35 mm in Breite und Höhe). Der Satzspiegel bleibt dadurch
# millimetergenau bei 97 x 172,2 mm: Bei gleichem Textblock brechen die
# Zeilen gleich um, und die Seitenzahl bleibt bei 160. Das ist keine
# Kosmetik — aus der Seitenzahl folgt die Rückenbreite, und beide Fassungen
# sollen denselben Umfang haben.
hardcover_seitenformat:
  breite_mm: 139.7      # 5,5 Zoll
  hoehe_mm: 215.9       # 8,5 Zoll
  rand_innen_mm: 23.35
  rand_aussen_mm: 19.35
  rand_oben_mm: 21.35
  rand_unten_mm: 22.35

