# Metadaten „Das Reptiliengehirn des Menschen".
# Wird von build/build_reptilienhirn.py gelesen.

titel: "Das Reptiliengehirn des Menschen"
untertitel: "Wie das schnelle Ich entscheidet, bevor du es tust"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: bernstein   # blatt | zitrone | beere | bernstein

# Bandkennung auf dem gefüllten Balken über dem Titel. Sie muss im
# Amazon-Vorschaubild bei rund 100 px Breite noch lesbar sein — also kurz.
cover_kennung: "SACHBUCH · GEHIRN"

# Markenhinweis unten auf der Rückseite. Ohne eigenen Eintrag stünde hier der
# cellRESET-Hinweis der Stoffwechsel-Reihe, der zu diesem Band nicht passt.
markenhinweis: >-
  Dieses Buch ist ein Sachbuch und ersetzt keine ärztliche oder
  psychotherapeutische Beratung. Genannte Marken sind Eigentum ihrer
  jeweiligen Inhaber. Bitte die Hinweise im Buch beachten.

# Dateiname ohne Endung für alles unter out/
slug: reptiliengehirn

# KDP-Satzspiegel — 6 x 9 Zoll wie Band 1 der Stoffwechsel-Reihe.
seitenformat:
  breite_mm: 152.4      # 6 Zoll
  hoehe_mm: 228.6       # 9 Zoll
  rand_innen_mm: 20.0
  rand_aussen_mm: 16.0
  rand_oben_mm: 18.0
  rand_unten_mm: 18.0

# Impressumsangaben — übernommen aus impressum.html, nicht frei erfunden.
