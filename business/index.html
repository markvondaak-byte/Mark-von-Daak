<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitLine Business</title>
<meta name="description" content="Kontaktdatenbank und Follow-up für Kunden und Teampartner.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E6B70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Business">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS rundet das Apple-Touch-Icon selbst — es wird deshalb randfüllend
     und ohne Transparenz geliefert. 180px ist die von Apple erwartete Größe. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Setzt den Farbmodus, bevor das erste Pixel gezeichnet wird. Ohne das
   blitzt beim Start kurz die helle Variante auf, auch wenn dunkel
   eingestellt ist. Muss deshalb inline im <head> stehen und darf nichts
   nachladen. */
(function () {
  var wahl = null;
  try { wahl = localStorage.getItem('fitline-business.modus'); } catch (e) {}
  var dunkel = wahl === 'dunkel' ||
    (wahl !== 'hell' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dunkel ? 'dark' : 'light';
})();
</script>
</head>
<body>

<div class="app">
  <header class="kopf">
    <div class="kopf__zeile">
      <div style="flex:1;min-width:0">
        <h1 id="kopf-titel">Heute</h1>
        <div class="kopf__sub" id="kopf-sub"></div>
      </div>
      <button class="ikon-knopf" id="knopf-suche" aria-label="Kontakt suchen">
        <svg><use href="#i-suche"/></svg>
      </button>
      <button class="ikon-knopf" id="knopf-einstellungen" aria-label="Einstellungen">
        <svg><use href="#i-zahnrad"/></svg>
      </button>
    </div>
  </header>

  <main class="inhalt" id="inhalt" tabindex="-1"></main>

  <button class="schnellknopf" id="knopf-neu" aria-label="Neuer Kontakt">
    <svg><use href="#i-plus"/></svg>
  </button>

  <nav class="tabs" role="tablist" aria-label="Hauptbereiche">
    <button class="tab" role="tab" data-ansicht="heute" aria-selected="true">
      <svg><use href="#i-heute"/></svg>Heute
    </button>
    <button class="tab" role="tab" data-ansicht="kontakte" aria-selected="false">
      <svg><use href="#i-kontakte"/></svg>Kontakte
    </button>
    <button class="tab" role="tab" data-ansicht="followup" aria-selected="false">
      <svg><use href="#i-followup"/></svg>Follow-up
    </button>
    <button class="tab" role="tab" data-ansicht="team" aria-selected="false">
      <svg><use href="#i-team"/></svg>Team
    </button>
    <button class="tab" role="tab" data-ansicht="zahlen" aria-selected="false">
      <svg><use href="#i-zahlen"/></svg>Zahlen
    </button>
  </nav>
</div>

<div id="blatt-halter"></div>

<script src="app.js"></script>
</body>
</html>
