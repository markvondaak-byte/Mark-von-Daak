# Metadaten — Der Darm im Gleichgewicht.
# Wird von buch/build/build_docx.py und buch/build/build_cover.py gelesen:
#
#     python3 buch/build/build_docx.py darm
#     python3 buch/build/build_cover.py darm
#
# Ein eigenständiger Titel. Er setzt kein anderes Buch voraus, nennt kein
# Ernährungskonzept als Bedingung und verkauft nichts. Dass er mit denselben
# Skripten gebaut wird wie andere Titel in diesem Repository, ist eine Frage
# der Werkzeuge und keine inhaltliche Verbindung — im Buch und auf dem
# Umschlag taucht davon nichts auf.

titel: "Der Darm im Gleichgewicht"
untertitel: "Wie Verdauung wirklich funktioniert — mit 8-Wochen-Programm und 40 Rezepten"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: hafer   # blatt | zitrone | beere | hafer

# Steht als Balken über dem Titel und sagt in zwei Worten, was das Buch ist —
# im Amazon-Vorschaubild ist der Untertitel dafür zu klein.
cover_kennung: "DARMGESUNDHEIT · 8 WOCHEN"

# Fußzeile der Rückseite. Ohne diese Angabe stünde hier der Markenhinweis der
# Stoffwechsel-Reset-Reihe — der gehört auf einen Titel, der mit jenem Konzept
# nichts zu tun hat, ausdrücklich nicht.
cover_hinweis: >-
  Kein medizinischer Ratgeber. Dieses Buch ersetzt keine ärztliche Beratung,
  Diagnose oder Behandlung — bitte die Hinweise im Buch beachten.

slug: darm-im-gleichgewicht

# 6 × 9 Zoll. Ein Lesebuch mit über 200 Seiten — ein Großformat wäre hier
# unhandlich, und 6 × 9 steht bei KDP sowohl in der Taschenbuch- als auch in
# der Hardcover-Liste. Ein Innenteil trägt damit beide Bindearten.
seitenformat:
  breite_mm: 152.4      # 6 Zoll
  hoehe_mm: 228.6       # 9 Zoll
  rand_innen_mm: 20.0
  rand_aussen_mm: 16.0
  rand_oben_mm: 18.0
  rand_unten_mm: 18.0

# Impressumsangaben — übernommen aus impressum.html, nicht frei erfunden.
