<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Stoffwechsel-Reset</title>
<meta name="description" content="Dein Begleiter durch das 4-Phasen-Ernährungskonzept: Tagesplan, Rezepte, Nachschlagewerk und Fortschritt.">
<meta name="theme-color" content="#C8102E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stoffwechsel-Reset">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Ikonen einmal definiert, per <use> referenziert -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-heute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="12" cy="15.5" r="2"/>
  </symbol>
  <symbol id="i-programm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M9 9v12M15 9v12"/>
  </symbol>
  <symbol id="i-rezepte" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 3v7a3 3 0 0 0 6 0V3M8 10v11M17 3c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM17 12v9"/>
  </symbol>
  <symbol id="i-wissen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/>
  </symbol>
  <symbol id="i-fortschritt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18M6 16l4-5 3.5 3L19 7"/><circle cx="19" cy="7" r="1.6"/>
  </symbol>
  <symbol id="i-haken" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12.5 9.5 18 20 6.5"/>
  </symbol>
  <symbol id="i-zurueck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/>
  </symbol>
  <symbol id="i-schliessen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-zahnrad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/>
  </symbol>
  <symbol id="i-suche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
  </symbol>
  <symbol id="i-leer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 15.5c1-1 2.2-1.5 3.5-1.5s2.5.5 3.5 1.5"/>
  </symbol>
</svg>

<div class="app">
  <header class="kopf">
    <div class="kopf__zeile">
      <div style="flex:1">
        <h1 id="titel">Heute</h1>
        <div class="kopf__sub" id="untertitel"></div>
      </div>
      <button class="ikon-knopf" id="einstellungen-auf" aria-label="Einstellungen">
        <svg><use href="#i-zahnrad"/></svg>
      </button>
    </div>
  </header>

  <main class="inhalt" id="inhalt" tabindex="-1"></main>

  <nav class="tabs" role="tablist" aria-label="Hauptbereiche">
    <button class="tab" role="tab" data-ansicht="heute" aria-selected="true">
      <svg><use href="#i-heute"/></svg>Heute
    </button>
    <button class="tab" role="tab" data-ansicht="programm" aria-selected="false">
      <svg><use href="#i-programm"/></svg>Programm
    </button>
    <button class="tab" role="tab" data-ansicht="rezepte" aria-selected="false">
      <svg><use href="#i-rezepte"/></svg>Rezepte
    </button>
    <button class="tab" role="tab" data-ansicht="wissen" aria-selected="false">
      <svg><use href="#i-wissen"/></svg>Wissen
    </button>
    <button class="tab" role="tab" data-ansicht="fortschritt" aria-selected="false">
      <svg><use href="#i-fortschritt"/></svg>Verlauf
    </button>
  </nav>
</div>

<div id="blatt-halter"></div>

<script src="app.js"></script>
</body>
</html>
