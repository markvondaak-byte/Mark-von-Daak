preise: netto            # netto (zzgl. USt.) oder brutto (inkl. USt., üblich bei Privatkunden)
steuerfall: normal       # normal | kleinunternehmer | reverse_charge | ig_lieferung | drittland
ust: 19                  # Standardsatz für alle Positionen; je Position überschreibbar (7, 0 …)

positionen:
