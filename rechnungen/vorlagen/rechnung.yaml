  name: ""
  zusatz: ""
  strasse: ""
  plz_ort: ""
  land: ""               # leer = Deutschland
  kundennummer: ""
  ust_id: ""             # nur bei Firmen, Pflicht bei Reverse Charge

betreff: ""
