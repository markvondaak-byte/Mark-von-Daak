nummer: auto             # wird beim ersten Bauen vergeben und hier eingetragen
datum: heute
leistungsdatum: ""       # Pflicht: 2026-11-27 (Tag) oder 2026-11 (Monat) oder Freitext "03.–28.11.2026"

empfaenger:
