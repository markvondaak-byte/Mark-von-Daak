# FitLine-Produktkatalog für Rechnungen (Hersteller: PM-International)
#
# In einer Rechnung genügt:   - artikel: powercocktail
#                               menge: 2
# Name, Einheit, Preis und Steuersatz kommen von hier; alles in der Position
# Angegebene (z. B. preis:) überschreibt den Katalog.
#
# preise: brutto = Endkundenpreise inkl. USt. (so wie FitLine sie angibt).
#
# BITTE VOR NUTZUNG PRÜFEN:
#  * Preise stammen von einer Partnerseite (fitonline.de, Stand Nov. 2026, ohne
#    Datum) und nicht aus deinem Partner-Backoffice. Mit deiner aktuellen
#    Preisliste abgleichen und Packungsgrößen/Artikelnummern ergänzen.
#
# STEUERSÄTZE (von Mark bestätigt, wie von FitLine deklariert):
#  * Nahrungsergänzung: 7 %  (Standard dieses Katalogs)
#  * Kosmetik:         19 %
#  * alle übrigen Shop-Artikel (Zubehör, Shaker, Werbemittel …): 19 %
#  * Produkte ohne Preis (preis: null) erst ausfüllen – sonst bricht das Bauen ab.

