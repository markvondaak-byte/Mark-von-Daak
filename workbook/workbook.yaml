# Metadaten Band 2 — Das 12-Wochen-Workbook.

titel: "Der Stoffwechsel-Reset"
untertitel: "Das 12-Wochen-Workbook"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: zitrone   # blatt | zitrone | beere

slug: workbook

# 8 × 10 Zoll — Großformat, immer noch deutlich mehr Schreibfläche als das
# Buch, liegt flach auf dem Tisch.
#
# Vorher stand hier A4 (8,27 × 11,69 Zoll). Das ist für ein Heft zum Ausfüllen
# minimal besser, steht bei KDP aber nicht in der Auswahlliste und muss als
# benutzerdefinierte Trimmgröße eingetragen werden — daran ist der Upload
# gescheitert. 8 × 10 kommt aus der Liste und kostet nur 17 Prozent Fläche
# (6 × 9 hätte 44 Prozent gekostet).
#
# Die Höhe ist der knappe Wert: 42,9 mm weniger als A4. Zwei Tageskarten
# müssen weiterhin auf eine Seite passen, deshalb sind die Ränder oben und
# unten enger als vorher. KDP verlangt bei 76 bis 150 Seiten mindestens
# 9,5 mm innen.
seitenformat:
  breite_mm: 203.2      # 8 Zoll
  hoehe_mm: 254.0       # 10 Zoll
  rand_innen_mm: 20.0   # Bundsteg
  rand_aussen_mm: 14.0
  rand_oben_mm: 15.0
  rand_unten_mm: 15.0

