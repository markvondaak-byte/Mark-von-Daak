# Metadaten Band 2 — Das 12-Wochen-Workbook.

titel: "Der Stoffwechsel-Reset"
untertitel: "Das 12-Wochen-Workbook"
autor: "Mark von Daak"
sprache: de
version: "1.0"
jahr: 2026

# Cover-Farbwelt: "hell" (Papierweiß) oder "schiefer" (dunkler Grund)
cover_stil: schiefer
cover_akzent: zitrone   # blatt | zitrone | beere

slug: workbook

# A4-nah. Mehr Schreibfläche als beim Buch, liegt flach auf dem Tisch.
#
# Die Maße sind bewusst nicht die runden 210 × 297 mm, sondern KDPs Trimmgröße
# 8,27 × 11,69 Zoll. KDP rechnet intern in Zoll und prüft Innenteil und
# Umschlag gegen diese Werte; mit den runden Millimetern war der Umschlag
# 0,12 mm zu schmal und 0,07 mm zu hoch.
seitenformat:
  breite_mm: 210.058    # 8,27 Zoll
  hoehe_mm: 296.926     # 11,69 Zoll
  rand_innen_mm: 22.0   # mehr Bundsteg wegen höherer Seitenzahl
  rand_aussen_mm: 16.0
  rand_oben_mm: 18.0
  rand_unten_mm: 18.0

